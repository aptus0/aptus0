<svg width="900" height="300" viewBox="0 0 900 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">Samet ER pixel portfolio loading screen</title>
  <desc id="description">An animated pixel-art loading screen for an Agentforce and Salesforce engineer.</desc>
  <rect width="900" height="300" rx="18" fill="#080B16"/>
  <rect x="18" y="18" width="864" height="264" rx="10" fill="#10172B" stroke="#29355B" stroke-width="2"/>
  <path d="M18 74H882M18 226H882" stroke="#29355B" stroke-width="2" stroke-dasharray="6 10"/>
  <g fill="#7C3AED">
    <rect x="54" y="48" width="10" height="10"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" repeatCount="indefinite"/></rect>
    <rect x="70" y="48" width="10" height="10"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin=".15s" repeatCount="indefinite"/></rect>
    <rect x="86" y="48" width="10" height="10"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin=".3s" repeatCount="indefinite"/></rect>
  </g>
  <text x="450" y="70" fill="#B9C6FF" font-family="monospace" font-size="16" text-anchor="middle" letter-spacing="5">SAMET_ER.EXE</text>
  <g transform="translate(112 111)">
    <rect x="0" y="38" width="18" height="18" fill="#1F2A4A"/>
    <rect x="18" y="20" width="18" height="54" fill="#7C3AED"/>
    <rect x="36" y="2" width="18" height="90" fill="#A78BFA"/>
    <rect x="54" y="20" width="18" height="54" fill="#7C3AED"/>
    <rect x="72" y="38" width="18" height="18" fill="#1F2A4A"/>
    <rect x="27" y="29" width="9" height="9" fill="#FDE68A"/>
    <rect x="54" y="29" width="9" height="9" fill="#FDE68A"/>
    <animateTransform attributeName="transform" type="translate" values="112 111;112 101;112 111" dur="1.4s" repeatCount="indefinite"/>
  </g>
  <g font-family="monospace">
    <text x="245" y="135" fill="#F8FAFC" font-size="27" font-weight="bold" letter-spacing="2">AGENTFORCE ONLINE</text>
    <text x="245" y="163" fill="#71D7FF" font-size="15">TRUSTED AI  •  SALESFORCE  •  INTEGRATIONS</text>
    <text x="245" y="190" fill="#94A3B8" font-size="14">Loading enterprise agent architecture...</text>
  </g>
  <rect x="245" y="207" width="500" height="14" rx="2" fill="#1E293B"/>
  <rect x="245" y="207" width="500" height="14" rx="2" fill="#22C55E">
    <animate attributeName="width" values="0;500;500" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <g fill="#FDE68A">
    <rect x="778" y="116" width="12" height="12"><animate attributeName="opacity" values=".15;1;.15" dur=".9s" repeatCount="indefinite"/></rect>
    <rect x="796" y="134" width="12" height="12"><animate attributeName="opacity" values=".15;1;.15" dur=".9s" begin=".2s" repeatCount="indefinite"/></rect>
    <rect x="814" y="116" width="12" height="12"><animate attributeName="opacity" values=".15;1;.15" dur=".9s" begin=".4s" repeatCount="indefinite"/></rect>
  </g>
  <text x="450" y="260" fill="#64748B" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="3">PRESS START TO EXPLORE</text>
</svg>
